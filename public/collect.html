<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collect Food</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
      background-image: url('images/green-food-bg.jpg');
      background-size: cover;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 1200px; 
      margin: 40px auto;
      padding: 25px;
      background-color: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
    }

    h2 {
      text-align: center;
      color: #2f6627;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    select, input, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      font-size: 15px;
    }

    button.btn-green {
      background-color: #4CAF50;
      color: white;
      border: none;
      margin-top: 20px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.3s;
    }

    button.btn-green:hover {
      background-color: #45a049;
    }

 
    #foodList {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
      margin-top: 25px;
    }

    .card {
      background-color: #f0f9f0;
      padding: 15px 10px;
      border-left: 5px solid #4CAF50;
      border-radius: 10px;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.1);
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .food-name {
      font-weight: bold;
      color: #2f6627;
      font-size: 16px;
    }

    .location, .quantity {
      margin-top: 5px;
      font-size: 14px;
      color: #555;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background-color: rgba(255, 255, 255, 0.95);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    nav h1 {
      margin: 0;
      color: #2f6627;
    }

    nav .nav-links a {
      margin-left: 20px;
      text-decoration: none;
      color: #2f6627;
      font-weight: bold;
      transition: color 0.3s;
    }

    nav .nav-links a:hover {
      color: #4CAF50;
    }
  </style>
</head>
<body>
  <nav>
    <h1>Collect Food</h1>
    <div class="nav-links">
      <a href="donate.html">Donate Food</a>
      <a href="dashboard.html">Dashboard</a>
    </div>
  </nav>

  <div class="container">
    <h2>Collect Available Food</h2>

    <label for="foodSelect">Select Food Item:</label>
    <select id="foodSelect">
      <option value="">-- Select a Food Item --</option>
    </select>

    <label for="locationInput">Location:</label>
    <input type="text" id="locationInput" placeholder="Location will auto-fill" readonly />

    <label for="quantitySelect">Quantity:</label>
    <select id="quantitySelect">
      <option value="">-- Select Quantity --</option>
    </select>

    <button id="collectBtn" class="btn-green">Collect Food</button>

    <h2>Available Food Items</h2>
    <div id="foodList"></div>
  </div>

  <script type="module" src="js/collect.js"></script>
</body>
</html>
