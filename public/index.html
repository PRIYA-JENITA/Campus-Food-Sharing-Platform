<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Food Sharing - Login</title>
<link rel="stylesheet" href="css/style.css">

<style>
body {
  background-image: url('images/food-login-bg.jpg');
  background-size: cover;
  background-position: center;
  font-family: Arial, sans-serif;
}
.login-box {
  max-width: 400px;
  margin: 120px auto;
  padding: 30px;
  background: rgba(255,255,255,0.95);
  border-radius: 10px;
  text-align: center;
  box-shadow: 0 3px 10px rgba(0,0,0,0.2);
}
.login-box input {
  width: 90%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 5px;
  border: 1px solid #ccc;
  font-size: 16px;
}
.login-box button {
  width: 45%;
  margin: 8px 5px;
  padding: 10px;
  border-radius: 5px;
  border: none;
  font-weight: bold;
  cursor: pointer;
}
.btn-blue { background-color: #4CAF50; color: white; }
.btn-green { background-color: #2196F3; color: white; }
.btn-blue:hover { background-color: #45a049; }
.btn-green:hover { background-color: #1976D2; }
</style>
</head>
<body>

<div class="login-box">
  <h1>Campus Food Sharing</h1>
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <div>
    <button id="login" class="btn-blue">Login</button>
    <button id="signup" class="btn-green">Signup</button>
  </div>
</div>

<!-- Firebase + JS modules at end of body -->
<script type="module" src="js/firebase-config.js"></script>
<script type="module" src="js/login.js"></script>

</body>
</html>
